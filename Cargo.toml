[workspace]
resolver = "3"
members = [
    "crates/golden-core",
    "crates/golden-pallas",
    "crates/golden-proofs",
    "crates/frost-redpallas",
    "crates/golden-cli",
]

[workspace.package]
authors = ["Golden RedPallas contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/golden-redpallas"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
