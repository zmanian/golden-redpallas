name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Rust test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace

      - name: Test Pallas proof backend
        run: cargo test -p golden-proofs --features pallas-backend

      - name: Test Pallas proof backend release path
        run: cargo test --release -p golden-proofs --features pallas-backend

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: CLI smoke test
        run: cargo run -p golden-cli -- verify test-vectors/golden-pallas/dkg-v0.txt

      - name: Transcript parser fuzz smoke test
        run: cargo run -p golden-pallas --example fuzz_session_transcript -- test-vectors/golden-pallas/dkg-v0.txt

      - name: Proof public-input decoder fuzz smoke test
        run: cargo run -p golden-proofs --example fuzz_proof_public_inputs -- test-vectors/golden-pallas/dkg-v0.txt

  audit:
    name: Advisory and license checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec advisory check
        run: cargo audit

      - name: Workspace license check
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps |
            ruby -rjson -e 'data = JSON.parse(STDIN.read); bad = data.fetch("packages").reject { |pkg| pkg["license"] == "MIT OR Apache-2.0" }; abort("unexpected package licenses: #{bad.map { |pkg| "#{pkg["name"]}=#{pkg["license"].inspect}" }.join(", ")}") unless bad.empty?'

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs:
      - test
      - audit

    steps:
      - name: Release checks passed
        run: echo "Release artifacts require test and audit jobs to pass."
